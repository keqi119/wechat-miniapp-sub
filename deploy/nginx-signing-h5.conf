# Include inside the existing app.subauto.keybox.cloud server block.
# This prefix serves only the independent platform. Existing portal routes stay owned by their original application.
location = /miniapp-sign { return 302 /miniapp-sign/; }
location = /miniapp-sign/ {
    root /opt/wechat-miniapp-sub/current/signing-h5;
    try_files /index.html =404;
    default_type text/html;
    include /opt/wechat-miniapp-sub/deploy/nginx-signing-h5-headers.conf;
    access_log /opt/wechat-miniapp-sub/logs/signing-h5.access.log chundian_h5;
}
location = /miniapp-sign/return/ {
    root /opt/wechat-miniapp-sub/current/signing-h5;
    try_files /index.html =404;
    default_type text/html;
    include /opt/wechat-miniapp-sub/deploy/nginx-signing-h5-headers.conf;
    access_log /opt/wechat-miniapp-sub/logs/signing-h5.access.log chundian_h5;
}
location ^~ /miniapp-sign/assets/ {
    alias /opt/wechat-miniapp-sub/current/signing-h5/assets/;
    include /opt/wechat-miniapp-sub/deploy/nginx-signing-h5-headers.conf;
    access_log off;
}
location = /miniapp-sign/api/auth/sms/request {
    limit_req zone=chundian_h5_sms burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:13101/api/h5-sign/auth/sms/request;
    include /opt/wechat-miniapp-sub/deploy/nginx-signing-h5-proxy.conf;
}
location = /miniapp-sign/api/auth/login {
    limit_req zone=chundian_h5_auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:13101/api/h5-sign/auth/login;
    include /opt/wechat-miniapp-sub/deploy/nginx-signing-h5-proxy.conf;
}
location ^~ /miniapp-sign/api/ {
    proxy_pass http://127.0.0.1:13101/api/h5-sign/;
    include /opt/wechat-miniapp-sub/deploy/nginx-signing-h5-proxy.conf;
}
location ^~ /miniapp-sign/ { return 404; }
