# Install as vhost/nginx/00-chundian-signing-http.conf, before the app server block.
limit_req_zone $binary_remote_addr zone=chundian_h5_sms:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=chundian_h5_auth:1m rate=10r/m;
log_format chundian_h5 '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
