# Only the two dedicated new hosts. Existing platform vhosts are untouched.
server {
    listen 80;
    server_name mini-admin.subauto.keybox.cloud mini-api.subauto.keybox.cloud;
    root /opt/wechat-miniapp-sub/acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { add_header Retry-After 600 always; return 503 'Service preparation in progress'; }
    access_log /opt/wechat-miniapp-sub/logs/nginx-http.access.log;
    error_log /opt/wechat-miniapp-sub/logs/nginx-http.error.log;
}
