limit_req_zone $binary_remote_addr zone=chundian_sms:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=chundian_auth:1m rate=10r/m;
log_format chundian '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    listen 80;
    server_name mini-admin.subauto.keybox.cloud mini-api.subauto.keybox.cloud;
    root /opt/wechat-miniapp-sub/acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name mini-admin.subauto.keybox.cloud;
    ssl_certificate /opt/wechat-miniapp-sub/tls/live/chundian-mini/fullchain.pem;
    ssl_certificate_key /opt/wechat-miniapp-sub/tls/live/chundian-mini/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/wechat-miniapp-sub/current/admin;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://mini-api.subauto.keybox.cloud; img-src 'self' blob: data: https://mini-api.subauto.keybox.cloud; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { expires -1; }
    location ~ /\. { deny all; }
    access_log /opt/wechat-miniapp-sub/logs/admin.access.log chundian;
    error_log /opt/wechat-miniapp-sub/logs/admin.error.log;
}
server {
    listen 443 ssl;
    http2 on;
    server_name mini-api.subauto.keybox.cloud;
    ssl_certificate /opt/wechat-miniapp-sub/tls/live/chundian-mini/fullchain.pem;
    ssl_certificate_key /opt/wechat-miniapp-sub/tls/live/chundian-mini/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # WeChat business-domain ownership proof; only this public verification file.
    location = /G1wS8MuuaR.txt {
        root /opt/wechat-miniapp-sub/wechat-domain-verification;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~* ^/api/customer/auth/sms/request/?$ {
        limit_req zone=chundian_sms burst=2 nodelay;
        limit_req_status 429;
        include /opt/wechat-miniapp-sub/deploy/nginx-proxy.conf;
    }
    location ~* ^/api/admin/auth/login/?$ {
        limit_req zone=chundian_auth burst=5 nodelay;
        limit_req_status 429;
        include /opt/wechat-miniapp-sub/deploy/nginx-proxy.conf;
    }
    location /api/ { include /opt/wechat-miniapp-sub/deploy/nginx-proxy.conf; }
    location / { return 404; }
    access_log /opt/wechat-miniapp-sub/logs/api.access.log chundian;
    error_log /opt/wechat-miniapp-sub/logs/api.error.log;
}
