limit_req_zone $binary_remote_addr zone=ninda_sms:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ninda_auth:1m rate=10r/m;
log_format ninda '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    listen 80;
    server_name api.evsub.ndacar.com admin.evsub.ndacar.com sign.evsub.ndacar.com;
    root /opt/ninda-platform/acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location ~ "^/(MP_verify_[A-Za-z0-9]+|[A-Za-z0-9]{10})\.txt$" {
        root /opt/ninda-platform/wechat-domain-verification;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
    access_log /opt/ninda-platform/logs/http.access.log ninda;
}
server {
    listen 443 ssl http2;
    server_name admin.evsub.ndacar.com;
    ssl_certificate /etc/letsencrypt/live/api.evsub.ndacar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.evsub.ndacar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/ninda-platform/current/admin;
    include /opt/ninda-platform/deploy/nginx-admin-static-performance.conf;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.evsub.ndacar.com; img-src 'self' blob: data: https://api.evsub.ndacar.com; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { expires -1; }
    location = /field.html { expires -1; }
    location ~ /\. { deny all; }
    access_log /opt/ninda-platform/logs/admin.access.log ninda;
    error_log /opt/ninda-platform/logs/admin.error.log;
}
server {
    listen 443 ssl http2;
    server_name api.evsub.ndacar.com;
    ssl_certificate /etc/letsencrypt/live/api.evsub.ndacar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.evsub.ndacar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Only platform ownership proof filenames are public; no directory listing.
    location ~ "^/(MP_verify_[A-Za-z0-9]+|[A-Za-z0-9]{10})\.txt$" {
        root /opt/ninda-platform/wechat-domain-verification;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~* ^/api/(customer|h5-sign|owner-h5)/auth/sms/request/?$ {
        limit_req zone=ninda_sms burst=2 nodelay;
        limit_req_status 429;
        include /opt/ninda-platform/deploy/nginx-proxy.conf;
    }
    location ~* ^/api/(admin|h5-sign|owner-h5)/auth/login/?$ {
        limit_req zone=ninda_auth burst=5 nodelay;
        limit_req_status 429;
        include /opt/ninda-platform/deploy/nginx-proxy.conf;
    }
    location ~ ^/api/admin/vehicles/[^/]+/documents/?$ { client_max_body_size 34m; include /opt/ninda-platform/deploy/nginx-proxy.conf; }
    location /api/ { include /opt/ninda-platform/deploy/nginx-proxy.conf; }
    location / { return 404; }
    access_log /opt/ninda-platform/logs/api.access.log ninda;
    error_log /opt/ninda-platform/logs/api.error.log;
}
server {
    listen 443 ssl http2;
    server_name sign.evsub.ndacar.com;
    ssl_certificate /etc/letsencrypt/live/api.evsub.ndacar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.evsub.ndacar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = / { return 302 /miniapp-sign/; }
    location = /owner { return 302 /owner/; }
    location = /owner/ {
        root /opt/ninda-platform/current/signing-h5;
        try_files /owner.html =404;
        include /opt/ninda-platform/deploy/nginx-signing-headers.conf;
    }
    location = /owner/return/ {
        root /opt/ninda-platform/current/signing-h5;
        try_files /owner.html =404;
        include /opt/ninda-platform/deploy/nginx-signing-headers.conf;
    }
    location ^~ /owner/assets/ {
        alias /opt/ninda-platform/current/signing-h5/assets/;
        include /opt/ninda-platform/deploy/nginx-signing-headers.conf;
    }
    location = /owner/api/auth/sms/request {
        limit_req zone=ninda_sms burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13101/api/owner-h5/auth/sms/request;
        include /opt/ninda-platform/deploy/nginx-owner-proxy.conf;
    }
    location = /owner/api/auth/login {
        limit_req zone=ninda_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13101/api/owner-h5/auth/login;
        include /opt/ninda-platform/deploy/nginx-owner-proxy.conf;
    }
    location ^~ /owner/api/ {
        proxy_pass http://127.0.0.1:13101/api/owner-h5/;
        include /opt/ninda-platform/deploy/nginx-owner-proxy.conf;
    }
    location = /miniapp-sign { return 302 /miniapp-sign/; }
    location = /miniapp-sign/ {
        root /opt/ninda-platform/current/signing-h5;
        try_files /index.html =404;
        include /opt/ninda-platform/deploy/nginx-signing-headers.conf;
    }
    location = /miniapp-sign/return/ {
        root /opt/ninda-platform/current/signing-h5;
        try_files /index.html =404;
        include /opt/ninda-platform/deploy/nginx-signing-headers.conf;
    }
    location ^~ /miniapp-sign/assets/ {
        alias /opt/ninda-platform/current/signing-h5/assets/;
        include /opt/ninda-platform/deploy/nginx-signing-headers.conf;
    }
    location = /miniapp-sign/api/auth/sms/request {
        limit_req zone=ninda_sms burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13101/api/h5-sign/auth/sms/request;
        include /opt/ninda-platform/deploy/nginx-signing-proxy.conf;
    }
    location = /miniapp-sign/api/auth/login {
        limit_req zone=ninda_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13101/api/h5-sign/auth/login;
        include /opt/ninda-platform/deploy/nginx-signing-proxy.conf;
    }
    location ^~ /miniapp-sign/api/ {
        proxy_pass http://127.0.0.1:13101/api/h5-sign/;
        include /opt/ninda-platform/deploy/nginx-signing-proxy.conf;
    }
    location ~ "^/(MP_verify_[A-Za-z0-9]+|[A-Za-z0-9]{10})\.txt$" {
        root /opt/ninda-platform/wechat-domain-verification;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
    access_log /opt/ninda-platform/logs/signing.access.log ninda;
    error_log /opt/ninda-platform/logs/signing.error.log;
}
