server {
    listen 80;
    server_name api.evsub.ndacar.com admin.evsub.ndacar.com sign.evsub.ndacar.com;
    root /opt/ninda-platform/acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { add_header Retry-After 600 always; return 503 'Service preparation in progress'; }
    access_log /opt/ninda-platform/logs/http.access.log combined;
    error_log /opt/ninda-platform/logs/http.error.log;
}
