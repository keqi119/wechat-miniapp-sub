client_max_body_size 32k;
proxy_http_version 1.1;
proxy_set_header Host app.subauto.keybox.cloud;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Authorization "";
proxy_set_header Cookie "h5_signing_session=$cookie_h5_signing_session";
proxy_connect_timeout 5s;
proxy_read_timeout 90s;
proxy_send_timeout 30s;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
include /opt/wechat-miniapp-sub/deploy/nginx-signing-h5-headers.conf;
access_log /opt/wechat-miniapp-sub/logs/signing-h5-api.access.log chundian_h5;
