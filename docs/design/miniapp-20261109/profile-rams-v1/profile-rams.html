<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>个人资料 · 样式提案</title>
  <style>
    :root {
      --brand: #f9be00;
      --ink: #231815;
      --muted: #62666a;
      --page: #f2f3f4;
      --surface: #ffffff;
      --line: #e1e3e5;
      --control: #bfc3c7;
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #e7e9eb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid #231815; outline-offset: 3px; }
    .proposal-label { margin: 20px auto 14px; max-width: 390px; padding: 0 16px; font-size: 12px; line-height: 20px; color: #50565a; display: flex; justify-content: space-between; gap: 12px; }
    .screen { width: 100%; max-width: 390px; margin: 0 auto; background: var(--page); min-height: 780px; }
    .system-safe { height: 24px; background: var(--surface); }
    .navigation { position: relative; height: 48px; display: flex; justify-content: center; align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); }
    .nav-title { font-size: 17px; line-height: 24px; font-weight: 600; margin: 0; }
    .back { position: absolute; left: 4px; top: 2px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; }
    .back svg { width: 20px; height: 20px; }
    .capsule { position: absolute; right: 12px; top: 9px; width: 76px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid #dedfe0; border-radius: 18px; background: white; }
    .capsule svg { width: 28px; height: 18px; }
    .capsule .separator { height: 17px; width: 1px; margin: 0 5px; background: #e4e5e6; }
    main { padding: 16px; }
    .profile-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px; }
    .profile-card + .profile-card { margin-top: 16px; }
    .card-heading { display: flex; min-height: 58px; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .card-heading h2 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }
    .verified { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--brand); color: var(--ink); border-radius: 3px; white-space: nowrap; font-size: 12px; line-height: 18px; font-weight: 500; }
    .verified svg { width: 12px; height: 12px; }
    .identity { margin: 0; }
    .identity-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; min-height: 48px; align-items: center; border-bottom: 1px solid var(--line); }
    .identity-row:last-child { border-bottom: 0; }
    .identity-row dt, .identity-row dd { margin: 0; font-size: 16px; font-weight: 400; line-height: 24px; color: var(--ink); }
    .identity-row dd { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .identity-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 46px; padding: 0 0 4px; }
    .identity-footer p { margin: 0; font-size: 12px; line-height: 18px; color: var(--muted); }
    .refresh { min-height: 44px; min-width: 64px; padding: 0; border: 0; background: transparent; text-align: right; font-size: 12px; line-height: 18px; color: #45494d; text-decoration: underline; text-underline-offset: 3px; }
    .save-note { font-size: 12px; line-height: 18px; color: var(--muted); }
    .document-row { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .document-row + .document-row { border-top: 1px solid var(--line); }
    .document-name { min-width: 0; flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 58px; padding: 0; border: 0; background: transparent; text-align: left; }
    .document-name .label { font-size: 15px; line-height: 24px; color: var(--ink); text-decoration: underline; text-decoration-color: #8a8b8c; text-underline-offset: 4px; white-space: nowrap; }
    .document-name .state { font-size: 12px; line-height: 18px; color: var(--muted); margin-top: 3px; }
    .document-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .replace, .remove { min-height: 44px; min-width: 44px; font-size: 14px; line-height: 20px; white-space: nowrap; padding: 0 7px; border-radius: 4px; background: var(--surface); }
    .replace { border: 1px solid var(--control); }
    .remove { border: 0; color: #51565b; }
    .documents-note { margin: 0; padding: 12px 0 16px; border-top: 1px solid var(--line); font-size: 12px; line-height: 20px; color: var(--muted); }
    .account-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 24px; }
    .account-button { min-height: 48px; padding: 0 12px; border: 1px solid var(--control); border-radius: 6px; background: var(--surface); font-size: 15px; line-height: 22px; font-weight: 400; }
    .legal { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 8px; }
    .legal button { border: 0; padding: 0 4px; min-height: 44px; background: transparent; font-size: 12px; color: var(--muted); }
    .legal .dot { color: #81868a; font-size: 12px; }
    .bottom-safe { height: 24px; }
    .proposal-note { max-width: 390px; margin: 16px auto 28px; padding: 0 16px; color: #50565a; font-size: 12px; line-height: 20px; }
    dialog { border: 1px solid var(--line); border-radius: 8px; padding: 20px; max-width: min(330px, calc(100% - 32px)); color: var(--ink); background: white; }
    dialog::backdrop { background: #15191e66; }
    dialog h2 { font-size: 17px; line-height: 24px; margin: 0 0 12px; }
    dialog p { font-size: 14px; line-height: 24px; margin: 0 0 18px; color: #51565b; }
    dialog button { min-height: 44px; width: 100%; background: var(--brand); border: 0; border-radius: 4px; font-size: 14px; }
    @media (max-width: 390px) { .proposal-label { margin-top: 10px; } }
    @media print { .proposal-label, .proposal-note { display: none; } :root { background: white; } }
  </style>
</head>
<body>
  <div class="proposal-label"><span>个人资料 · 样式提案 01</span><span>已实名 / 示例资料</span></div>
  <div class="screen" id="profile-proposal">
    <div class="system-safe" aria-hidden="true"></div>
    <header class="navigation">
      <button type="button" class="back" aria-label="返回" data-demo="正式页面将返回“我的”。本样式稿不跳转。"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h1 class="nav-title">个人资料</h1>
      <div class="capsule" aria-hidden="true"><svg viewBox="0 0 28 18"><circle cx="6" cy="9" r="1.8"/><circle cx="14" cy="9" r="2.4"/><circle cx="22" cy="9" r="1.8"/></svg><span class="separator"></span><svg viewBox="0 0 28 18"><circle cx="14" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="9" r="3"/></svg></div>
    </header>
    <main>
      <section class="profile-card" aria-labelledby="personal-title">
        <div class="card-heading">
          <h2 id="personal-title">个人信息</h2>
          <span class="verified"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="m2.5 7 3 3 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>已实名</span>
        </div>
        <dl class="identity">
          <div class="identity-row"><dt>姓名：</dt><dd>张宁</dd></div>
          <div class="identity-row"><dt>手机号：</dt><dd>13800000000</dd></div>
          <div class="identity-row"><dt>身份证号码：</dt><dd>3101**********0000</dd></div>
        </dl>
        <div class="identity-footer"><p>实名信息已锁定</p><button type="button" class="refresh" data-demo="正式页面将查询实名与证书状态，不会重新发起认证。本样式稿不会请求认证渠道。">刷新状态</button></div>
      </section>
      <section class="profile-card" aria-labelledby="documents-title">
        <div class="card-heading"><h2 id="documents-title">证件资料</h2><span class="save-note">操作后自动保存</span></div>
        <div class="document-row">
          <button type="button" class="document-name" aria-label="查看身份证人像面" data-demo="正式页面将打开已上传的身份证人像面。这是样式稿，未载入真实证件。"><span class="label">身份证人像面</span><span class="state">已上传 · 点击查看</span></button>
          <div class="document-actions"><button type="button" class="replace" aria-label="替换身份证人像面" data-demo="正式页面将选择替换图片，上传并自动保存；失败时保留原资料并提示重试。">替换</button><button type="button" class="remove" aria-label="移除身份证人像面" data-demo="正式页面将先确认是否移除证件，确认后保存。本样式稿不会删除任何资料。">移除</button></div>
        </div>
        <div class="document-row">
          <button type="button" class="document-name" aria-label="查看身份证国徽面" data-demo="正式页面将打开已上传的身份证国徽面。这是样式稿，未载入真实证件。"><span class="label">身份证国徽面</span><span class="state">已上传 · 点击查看</span></button>
          <div class="document-actions"><button type="button" class="replace" aria-label="替换身份证国徽面" data-demo="正式页面将选择替换图片，上传并自动保存；失败时保留原资料并提示重试。">替换</button><button type="button" class="remove" aria-label="移除身份证国徽面" data-demo="正式页面将先确认是否移除证件，确认后保存。本样式稿不会删除任何资料。">移除</button></div>
        </div>
        <p class="documents-note">仅本人及授权审核人员可查看证件。</p>
      </section>
      <div class="account-actions">
        <button type="button" class="account-button" data-demo="正式页面将联系宁达客服。本样式稿不会拨打电话。">联系客服</button>
        <button type="button" class="account-button" data-demo="正式页面将确认退出账户。本样式稿不会影响你的登录。">退出账户</button>
      </div>
      <nav class="legal" aria-label="协议与隐私"><button type="button" data-demo="正式页面将打开当前已发布的用户协议。本样式稿不替换协议正文。">用户协议</button><span class="dot" aria-hidden="true">·</span><button type="button" data-demo="正式页面将打开当前已发布的隐私政策。本样式稿不替换政策正文。">隐私政策</button></nav>
    </main>
    <div class="bottom-safe" aria-hidden="true"></div>
  </div>
  <p class="proposal-note">仅为排版样式确认；资料为合成示例。原小程序、实名记录与证件资料均未改动。</p>
  <dialog id="demo-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">样式预览</h2><p id="dialog-message"></p><form method="dialog"><button type="submit">知道了</button></form></dialog>
  <script>
    const dialog = document.getElementById('demo-dialog');
    document.getElementById('profile-proposal').addEventListener('click', event => {
      const target = event.target.closest('[data-demo]');
      if (!target) return;
      document.getElementById('dialog-message').textContent = target.dataset.demo;
      dialog.showModal();
    });
  </script>
</body>
</html>
