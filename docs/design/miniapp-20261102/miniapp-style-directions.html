  function evidence(s){return `<div class="nd-card"><div class="nd-row"><h3>交接证据</h3><small class="nd-muted">版本 1</small></div><div class="nd-compact-car">${image()}<div><h3>蔚来 ET5</h3><small class="nd-muted">交车里程 66,706 km</small></div></div>${action(`<span>${icon('image')}车辆查验照片</span><small>${s.read.includes('photo')?'已查看':'查看'}　›</small>`,'evidence','nd-evidence',`data-value="photo"`)}${action(`<span>${icon('clipboard-list')}现场查验清单</span><small>${s.read.includes('checklist')?'已查看':'查看'}　›</small>`,'evidence','nd-evidence',`data-value="checklist"`)}${action(`<span>${icon('file-text')}线上交接约定</span><small>${s.read.includes('terms')?'已查看':'查看'}　›</small>`,'evidence','nd-evidence',`data-value="terms"`)}</div>`;}

  function handover(k,s){
    const title={pending:'请确认交接事实',confirmed:'本人已确认',completed:'车辆交接已完成'}[s.handover];

  function use(k){return `<div class="nd-content nd-stack"><div><div class="nd-eyebrow">我的订阅</div><h1>每一天，安心用车。</h1></div><div class="nd-vehicle">${image()}<div class="nd-vehicle-text"><div class="nd-row"><h2>蔚来 ET5</h2><span class="nd-tag">用车中</span></div><p class="nd-muted nd-space-sm" style="font-size:13px">12个月方案 · 月费 ¥4,299</p></div></div><div class="nd-card"><div class="nd-row"><h3>本月账单</h3>${paid()}</div><p class="nd-muted nd-space-sm" style="font-size:13px">首期月费与押金已支付</p>${action('查看账单明细　→','bill','nd-text-button')}</div><div class="nd-card"><h3>车辆交接</h3>${action('查看交接记录　→','handover','nd-text-button')}</div></div>`;}
  function mine(){return `<div class="nd-content"><div class="nd-eyebrow">宁达订阅</div><h1>我的</h1><p class="nd-muted nd-space-sm">示例客户 · 个人账户</p><div class="nd-card nd-space"><div class="nd-row"><h3>资料审核</h3><span class="nd-tag">资料已审核</span></div><p class="nd-footer-note">运营已审核证件资料；未进行线上实名认证。</p></div><div class="nd-profile-rows">${action('我的订单　→','use','nd-text-button')}${action('账单与付款记录　→','bill','nd-text-button')}${action('交接记录　→','handover','nd-text-button')}</div></div>`;}
  function home(k,s){return `<div class="nd-content nd-stack"><div class="nd-eyebrow">宁达 · 纯电订阅</div><h1>把好车，<br>放进你的日常。</h1><div class="nd-vehicle">${image()}<div class="nd-vehicle-text"><h2>选一台适合自己的车</h2><p class="nd-footer-note">同车多方案，费用与期限清楚可选。</p>${action('开始选车','catalog','nd-primary nd-space')}</div></div><div class="nd-card"><h3>已有订阅</h3>${action('前往用车服务　→','use','nd-text-button')}</div>${route()}</div>`;}
  function tabbar(page){const entries=[['home','house','首页'],['catalog','car-front','选车'],['use','key-round','用车'],['mine','user-round','我的']];return `<nav class="nd-tabbar" aria-label="小程序主导航">${entries.map(([p,ic,t])=>action(`<span class="nd-tab-icon">${icon(ic)}</span><span>${t}</span>`,p,'',page===p?'aria-current="page"':'')).join('')}</nav>`;}
  function modal(s){if(!s.modal)return '';
    let title='',content='';
    if(s.modal==='photo'){title='车辆查验照片';content=image()+`<p class="nd-muted nd-space-sm">车型照片仅用于展示证据阅读样式，非真实交接照片。</p>`;}

    if(s.modal==='application'){title='提交申请前';const p=plans[s.plan];content=`<p>已选择：${p.name}，${money(p.fee)} / 月，押金 ¥6,000。</p><p>下一步填写申请资料，由运营审核后确认最终方案；本原型不会创建真实申请。</p>`;}
    if(s.modal==='dispute'){title='提出交接异议';content=`<p>正式流程可填写异议并提交后台处理。当前设计示意保留原状态，不表示同意完成交接。</p>`;}
    return `<div class="nd-modal-layer"><section class="nd-modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="nd-row"><h2>${title}</h2>${action(icon('x'),'close','nd-modal-close','aria-label="关闭"')}</div>${content}${action('返回','close','nd-primary nd-space-sm')}</section></div>`;
  }
  function render(k){const stage=root.querySelector(`[data-direction="${k}"]`),s=states[k];const mainPage=['home','catalog','use','mine'].includes(s.page);
    const currentMode=['bill','handover'].includes(s.page)?s.page:'catalog';

  function save(){if(window.openai?.setWidgetState){window.openai.setWidgetState({modelContent:null,privateContent:{pages:Object.fromEntries(Object.entries(states).map(([k,v])=>[k,{page:v.page,plan:v.plan,handover:v.handover}]))}}).catch(()=>{});}}
  function applySaved(snapshot){const saved=snapshot?.privateContent?.pages;if(!saved)return;for(const k of Object.keys(kinds)){const v=saved[k];if(!v)continue;if(['home','catalog','vehicle','use','mine','bill','handover'].includes(v.page))states[k].page=v.page;if([0,1].includes(v.plan))states[k].plan=v.plan;if(['completed','confirmed','pending'].includes(v.handover))states[k].handover=v.handover;render(k);}}

  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const stage=b.closest('[data-direction]');if(!stage)return;const k=stage.dataset.direction,s=states[k];

    if(['home','catalog','vehicle','use','mine','bill','handover'].includes(a)){s.page=a;s.notice='';}

    if(['application','dispute'].includes(a))s.modal=a;
    if(a==='close')s.modal=null;
    if(a==='confirm'&&s.agree&&s.read.length===3){s.handover='confirmed';s.agree=false;s.notice='演示：本人确认已留存，等待平台核对实际完成。';}
    render(k);save();if(s.modal)stage.querySelector('.nd-modal-close')?.focus();
  });
  root.addEventListener('change',e=>{const stage=e.target.closest('[data-direction]');if(!stage)return;const k=stage.dataset.direction,s=states[k];if(e.target.matches('[data-handover-state]')){s.handover=e.target.value;s.agree=false;s.read=[];s.notice='';render(k);save();}if(e.target.matches('[data-agree]')){s.agree=e.target.checked;const b=stage.querySelector('[data-action="confirm"]');if(b)b.disabled=!s.agree;}});
  root.addEventListener('keydown',e=>{const stage=e.target.closest('[data-direction]');if(!stage)return;const k=stage.dataset.direction,s=states[k];if(e.key==='Escape'&&s.modal){s.modal=null;render(k);}if(e.key==='Tab'&&s.modal){const buttons=[...stage.querySelectorAll('.nd-modal button')],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&e.target===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&e.target===last){e.preventDefault();first.focus();}}if(e.key==='Enter'&&e.target.matches('[data-search]')){s.query=e.target.value.trim();render(k);}});
})();
</script>
